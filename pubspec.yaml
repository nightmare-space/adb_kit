name: adb_kit
description: The best ADB client for Android/Windows/Linux/macOS.
publish_to: "none"
version: 1.6.0+53
environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - packages/plugins
  - packages/adb_util
  - packages/adb_interface

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  # pub dep #

  # localizations
  intl: ^0.19.0
  animations: ^2.0.2
  # # desktop window stype
  # flutter_acrylic: ^1.1.0
  # network
  dio: ^5.4.3
  # file drop
  desktop_drop: ^0.4.1
  file_selector: ^1.0.3
  # get app local dir
  path_provider: ^2.0.10
  # responsive ui
  responsive_framework: ^1.0.0
  # local pty
  flutter_pty: ^0.4.1
  # # color select
  # cyclop: ^0.5.2
  # some animations
  flutter_spinkit: ^5.1.0
  # svg image
  flutter_svg: ^1.1.0
  # state manager...
  get: ^4.6.6
  # can receive mdns message
  multicast_dns: ^0.3.0
  # generate QR widget
  qr_flutter: ^4.0.0
  # scan qr code with camera
  mobile_scanner: ^6.0.2
  path: ^1.8.0
  # launcher url
  url_launcher: ^6.3.1
  # adb command util
  # file selector,but developed by nightmare
  # adb plugin can launcher app
  # app_launcher:
  #   git: https://github.com/nightmare-space/app_launcher
  # can manage window on desktop
  window_manager: ^0.3.0
  screenshot: ^3.0.0
  device_info_plus: ^10.1.0
  archive: ^3.4.10

  # git dep #

  # some foundation
  global_repository:
    git: https://github.com/nightmare-space/global_repository
  # multicast on LAN
  multicast:
    git: https://github.com/nightmare-space/multicast
  # foundation settings
  settings:
    git: https://github.com/nightmare-space/settings
  # adb plugin can view android device info and cpu/gpu status
  # device_info:
  #   git: https://github.com/nightmare-space/device_info.git
  # terminal widget
  xterm:
    git:
      url: https://github.com/TerminalStudio/xterm.dart
      ref: master

  # empty repo #

  file_manager:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: file_manager
  dart_adb:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: dart_adb
  adb_kit_extension:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: adb_kit_extension
  termux_api_plugin:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: termux_api_plugin
  behavior_api:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: behavior_api
  adb_library:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: adb_library
  android_api_server_client:
    git:
      url: https://github.com/nightmare-space/android_api_server_client
  android_tool:
    git:
      url: https://github.com/nightmare-space/empty_package
      path: android_tool

  # local dep #
  plugins:
    path: packages/plugins
  adb_util:
  adb_interface:
  network_info_plus: ^6.1.3
  app_settings: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.7
  retrofit_generator: ^8.1.0
  build_runner: ^2.1.11
  json_serializable: ^6.2.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: MenloforPowerline
      fonts:
        - asset: assets/fonts/MenloforPowerline.ttf
  assets:
    - assets/
    - CHANGELOG.md
# dependency_overrides:

flutter_intl:
  enabled: true
  class_name: S
